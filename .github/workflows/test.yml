name: Test

on:
  push:
    branches: [master, main, devel]
  pull_request:
    branches: [master, main, devel]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check version
        run: uv run mrun --version

      - name: Run tests
        run: uv run pytest