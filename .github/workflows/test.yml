name: Test

on:
  push:
    branches: [master, devel]
  pull_request:
    branches: [master, devel]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check version
        run: uv run moccarun.py --version

      - name: Run tests
        run: uv run pytest

      - name: Tool install
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            uv tool install --name mrun .
          else
            uv tool install --name mrun-dev .
          fi

      - name: Tool version check
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            mrun --version
          else
            mrun-dev --version
          fi

