[project]
name = "moccarun"
version = "1.0.0"
description = "MOCCA simulation runner for SLURM clusters"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Grzegorz Wiktorowicz" }
]
keywords = ["mocca", "slurm", "simulation", "astronomy", "nbody"]
dependencies = [
    "loguru>=0.7.3",
]

[tool.setuptools]
py-modules = ["moccarun"]

[project.scripts]
mrun = "moccarun:main"